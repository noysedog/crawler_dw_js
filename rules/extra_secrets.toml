# Regole aggiuntive per i SEGRETI (stesso formato di gitleaks.toml, piu' qualche campo extra).
# Campi extra supportati: severity, confidence, validator, tags, aggressive, enabled.
# NB: niente apici singoli nelle regex (usa \x27) cosi' si possono scrivere in '''...'''.
# Se gitleaks.toml e' presente nella stessa cartella viene caricato per primo: le regole
# di questo file con lo stesso id lo sovrascrivono.

[[rules]]
id = "aws-access-key-id"
description = "AWS access key ID"
regex = '''\b((?:AKIA|ASIA)[A-Z2-7]{16})\b'''
secretGroup = 1
keywords = ["akia", "asia"]
severity = "high"

[[rules]]
id = "github-token"
description = "GitHub token (classic o fine-grained)"
regex = '''\b(gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82})\b'''
secretGroup = 1
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_"]
severity = "high"

[[rules]]
id = "stripe-secret-key"
description = "Stripe secret/restricted key (live)"
regex = '''\b([sr]k_live_[0-9a-zA-Z]{24,99})\b'''
secretGroup = 1
keywords = ["sk_live_", "rk_live_"]
severity = "critical"

[[rules]]
id = "stripe-publishable-key"
description = "Stripe publishable key (pubblica per design)"
regex = '''\b(pk_live_[0-9a-zA-Z]{24,99})\b'''
secretGroup = 1
keywords = ["pk_live_"]
severity = "info"

[[rules]]
id = "slack-token"
description = "Slack token"
regex = '''\b(xox[baprs]-[A-Za-z0-9-]{10,72})\b'''
secretGroup = 1
keywords = ["xox"]
severity = "high"

[[rules]]
id = "slack-webhook"
description = "Slack incoming webhook"
regex = '''(https://hooks\.slack\.com/services/T[A-Z0-9]{8,12}/B[A-Z0-9]{8,12}/[A-Za-z0-9]{24})'''
secretGroup = 1
keywords = ["hooks.slack.com"]
severity = "high"

[[rules]]
id = "discord-webhook"
description = "Discord webhook"
regex = '''(https://(?:discord|discordapp)\.com/api/webhooks/\d{17,20}/[\w-]{60,72})'''
secretGroup = 1
keywords = ["discord"]
severity = "high"

[[rules]]
id = "sendgrid-api-key"
description = "SendGrid API key"
regex = '''\b(SG\.[\w-]{22}\.[\w-]{43})\b'''
secretGroup = 1
keywords = ["sg."]
severity = "high"

[[rules]]
id = "twilio-api-key"
description = "Twilio API key SID"
regex = '''\b(SK[0-9a-fA-F]{32})\b'''
secretGroup = 1
severity = "medium"
confidence = "medium"

[[rules]]
id = "npm-token"
description = "npm access token"
regex = '''\b(npm_[A-Za-z0-9]{36})\b'''
secretGroup = 1
keywords = ["npm_"]
severity = "high"

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\b(\d{8,10}:AA[A-Za-z0-9_-]{33})\b'''
secretGroup = 1
keywords = [":aa"]
severity = "high"

[[rules]]
id = "google-api-key"
description = "Google API key (spesso pubblica per design: verifica le restrizioni)"
regex = '''\b(AIza[0-9A-Za-z_-]{35})\b'''
secretGroup = 1
keywords = ["aiza"]
severity = "info"

[[rules]]
id = "azure-storage-connection-string"
description = "Azure Storage connection string con AccountKey"
regex = '''(DefaultEndpointProtocol=https?;AccountName=[^;"\s\x27]{3,24};AccountKey=[A-Za-z0-9+/=]{86,90})'''
secretGroup = 1
keywords = ["accountkey"]
severity = "critical"

[[rules]]
id = "private-key"
description = "Chiave privata PEM"
regex = '''-----BEGIN [A-Z ]{0,20}PRIVATE KEY-----[A-Za-z0-9+/=\\\s]{40,4000}?-----END [A-Z ]{0,20}PRIVATE KEY-----'''
keywords = ["private key"]
severity = "critical"

[[rules]]
id = "jwt"
description = "JSON Web Token hardcoded"
regex = '''\b(eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})(?![A-Za-z0-9_-])'''
secretGroup = 1
keywords = ["eyj"]
validator = "jwt"
severity = "medium"

[[rules]]
id = "url-with-credentials"
description = "URL con utente:password incorporati"
regex = '''(https?://[^/\s:@"\x27`]{1,64}:[^/\s:@"\x27`]{1,64}@[^\s"\x27`]{3,200})'''
secretGroup = 1
keywords = ["://"]
severity = "high"
confidence = "medium"

[[rules]]
id = "generic-secret-assignment"
description = "Assegnazione generica di password/token/api key (filtrata per entropia)"
regex = '''(?i)["\x27]?(?:api[_-]?key|apikey|secret(?:[_-]?key)?|token|passw(?:or)?d|pwd|client[_-]?secret|access[_-]?token|auth[_-]?token|private[_-]?key)["\x27]?\s*[:=]\s*["\x27]([^"\x27\s]{8,120})["\x27]'''
secretGroup = 1
entropy = 3.5
keywords = ["key", "secret", "token", "pass", "pwd"]
severity = "medium"
confidence = "low"